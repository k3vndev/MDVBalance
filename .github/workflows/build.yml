name: Build MDVBalance

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-java-21:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build with Maven
        run: mvn -B -DskipTests clean package
      - uses: actions/upload-artifact@v4
        with:
          name: MDVBalance-1.1.0
          path: target/MDVBalance-1.1.0.jar

  verify-java-25:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify build on Java 25
        run: mvn -B -DskipTests clean package
